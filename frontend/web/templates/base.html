{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>PoliSong</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'disco.png' %}">

    <!-- ESTILOS INCRUSTADOS -->
    <style>
    .menu-item {
    transition: all 0.25s ease-out;
    }

    .menu-item:hover {
    background-color: rgba(255,255,255,0.15);
    transform: translateX(6px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .menu-item {
    opacity: 0;
    transform: translateX(-18px);
    animation: fadeSlideIn 0.6s ease forwards;
    }

    @keyframes fadeSlideIn {
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .list-group .menu-item:nth-child(n) {
        animation-delay: calc(0.08s * var(--i));
    }

        body {
            background: #21155fb7;
            font-family: "Poppins", sans-serif;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(90deg, #121820, #1e293b) !important;
            padding: 14px 20px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 16px;
            margin-left: 12px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #8404ee !important;
            transform: translateY(-2px);
        }

        /* Contenedor donde va el contenido de los módulos */
        .container {
            margin-top: 45px;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Animación suave */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ANIMACIÓN DE APARICIÓN DEL NAVBAR */
        .navbar {
            animation: slideDown 0.7s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-18px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* SUBRAYADO DESLIZANTE EN LOS LINKS */
        .nav-link {
            position: relative;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #9d78ff;
            transition: width 0.35s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* EFECTO DE BRILLO SUAVE EN EL LOGO */
        .navbar-brand {
            animation: glow 3s infinite ease-in-out;
            text-shadow: 0 0 0px #cfc2ff;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 0px #cfc2ff; }
            50% { text-shadow: 0 0 10px #dcd1ff; }
            100% { text-shadow: 0 0 0px #cfc2ff; }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'index' %}">PoliSong</a>

        <div>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'usuarios_list' %}">Usuarios</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'discos_list' %}">Discos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'canciones_list' %}">Canciones</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'vinilos_list' %}">Vinilos</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
