{% block content %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Formulario Canciones</title>

     <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'disco.png' %}">

    <!-- Fuente CINZEL elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #644f82, #4060b1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        h3 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            text-align: center;
            color: #000000;
            text-shadow: 0 0 10px #a749e2;
            margin-bottom: 20px;
        }

        .card {
            border-radius: 18px;
            padding: 10px;
            background: #ffffffd8;
            backdrop-filter: blur(6px);
            animation: scaleIn 0.5s ease-out;
            box-shadow: 0px 0px 25px rgba(138, 100, 255, 0.5);
        }

        .form-label { font-weight: 600; color: #2c1f55; }

        .form-control {
            border: 2px solid #c7b7ff;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #8d55ff;
            box-shadow: 0 0 8px #b79cff;
        }

        .btn-save {
            background-color: #7d4bff;
            color: white !important;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 12px #bca6ff;
        }

        .btn-back {
            color: #ffffff !important;
            font-weight: bold;
            border-radius: 10px;
            background: #372266;
            transition: 0.2s;
        }
        .btn-back:hover { background: #5636a5; }

        /* Animaciones */
        @keyframes scaleIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>
<div class="container py-4 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body">

            <h3>{{ cancion.id_cancion|default:"Crear Canción" }}</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ cancion.nombre|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Duración (segundos)</label>
                    <input type="number" name="duracion" class="form-control" value="{{ cancion.duracion|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tamaño (MB)</label>
                    <input type="number" name="tamaño_mb" class="form-control" value="{{ cancion.tamaño_mb|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Calidad (kbps)</label>
                    <input type="number" name="calidad_kbps" class="form-control" value="{{ cancion.calidad_kbps|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Disco</label>
                    <select name="id_disco" class="form-control">
                {% for disco in discos %}
                    <option value="{{ disco.id_disco }}"
                        {% if cancion.id_disco_id == disco.id_disco %}selected{% endif %}>
                        {{ disco.nombre }}
                    </option>
                {% endfor %}
                </select>
                </div>

                <button type="submit" class="btn-save w-100">Guardar</button>
            </form>
            <a href="{% url 'canciones_list' %}" class="btn-back btn w-100 mt-3">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
{% endblock %}
