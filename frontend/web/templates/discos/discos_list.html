{% extends "base.html" %}
{% block title %}Discos MP3{% endblock %}
{% block content %}

<style>
    body { background: #21155fb7; }

    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&display=swap');

    h1 {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 48px;
        color: #000000;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #e0ddebe9;
        animation: titleAppear 1s ease-out;
    }

    .btn-purple {
        background-color: #7d4bff;
        color: white !important;
        font-weight: bold;
        border-radius: 10px;
        padding: 10px 18px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-purple:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 12px #e7e7e7;
    }

    .table thead {
        background: #212529;
        color: white;
        font-weight: bold;
    }

    .btn-edit { background-color: #16435b; color: rgb(255, 255, 255); font-weight: bold; }
    .btn-delete { background-color: #fb0606; color: rgb(255, 255, 255); font-weight: bold; }

    .card { border-radius: 12px; }

    @keyframes fadeRow {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    tbody tr {
        animation: fadeRow 0.6s ease forwards;
        opacity: 0;
    }
    tbody tr:nth-child(1) { animation-delay: .1s }
    tbody tr:nth-child(2) { animation-delay: .2s }
    tbody tr:nth-child(3) { animation-delay: .3s }
    tbody tr:nth-child(4) { animation-delay: .4s }
    tbody tr:nth-child(5) { animation-delay: .5s }
    tbody tr:nth-child(6) { animation-delay: .6s }

    @keyframes titleAppear {
        from { opacity: 0; transform: translateY(-12px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Discos MP3</h1>
        <a href="{% url 'discos_create' %}" class="btn btn-purple fw-bold">Nuevo Disco</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 60px;">#</th>
                        <th>Nombre</th>
                        <th>Género</th>
                        <th style="width: 200px;">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                {% for d in discos %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ d.nombre }}</td>
                        <td>{{ d.genero }}</td>

                        <td>
                            <a href="{% url 'discos_update' d.id_disco %}" class="btn btn-edit btn-sm me-2">Editar</a>
                            <a href="{% url 'discos_delete' d.id_disco %}" class="btn btn-delete btn-sm">Eliminar</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="8" class="text-center text-muted py-3">
                            No hay discos registrados
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
